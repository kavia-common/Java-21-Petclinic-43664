# Spring Boot Actuator health/info exposure and Kubernetes probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Database init: ensure data.sql runs after JPA schema creation
spring.jpa.defer-datasource-initialization=true

# Optional: H2 console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Do not hardcode server.port here; pass via JVM args for preview compatibility.
# Example:
#   -Dserver.port=3002 -Dserver.address=0.0.0.0
#   -Dserver.port=0    -Dserver.address=0.0.0.0  (choose a random free port)

# springdoc-openapi settings
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Expose UI at /swagger-ui.html (redirects to /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger-ui.html
