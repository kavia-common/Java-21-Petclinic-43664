# Spring Boot Actuator health/info exposure and Kubernetes probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Database init: ensure data.sql runs after JPA schema creation
spring.jpa.defer-datasource-initialization=true

# Optional: H2 console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Bind to 0.0.0.0:3002 by default for container runtime as requested
server.address=0.0.0.0
server.port=3002

# springdoc-openapi settings
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
