# Spring Boot Actuator health/info exposure and Kubernetes probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Database init: ensure data.sql runs after JPA schema creation
spring.jpa.defer-datasource-initialization=true

# Optional: H2 console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Bind address/port for preview environment to avoid fragile CLI quoting
server.port=3002
server.address=0.0.0.0

# springdoc-openapi settings
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Expose UI at /swagger-ui.html (redirects to /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger-ui.html
